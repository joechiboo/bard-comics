<body>
  <main>
    <h1>Bard Comics</h1>
    <p class="tagline">把經典文學做成漫畫——小說大家不愛看，但故事本身不該被埋沒。</p>

    <ul class="cards">
      <li>
        <a class="card" href="shakespeare/">
          <h2>莎士比亞戲劇 <span class="badge">進行中</span></h2>
          <p>原文公版，劇本天生就是「對白＋場景」，直接轉分鏡。第一部：《馬克白》。</p>
        </a>
      </li>
      <li>
        <div class="card disabled">
          <h2>世說新語 <span class="badge soon">籌備中</span></h2>
          <p>每則都是獨立小故事，適合四格／單頁短漫。</p>
        </div>
      </li>
      <li>
        <div class="card disabled">
          <h2>四大奇書 <span class="badge soon">籌備中</span></h2>
          <p>三國演義、水滸傳、西遊記、金瓶梅。長篇，等產製流程成熟後再上。</p>
        </div>
      </li>
      <li>
        <div class="card disabled">
          <h2>金庸 <span class="badge soon">構想</span></h2>
          <p>版權仍在保護期（至 2068 年），需先取得授權。</p>
        </div>
      </li>
    </ul>
  </main>
  <footer>
    <a href="https://github.com/joechiboo/bard-comics">GitHub</a>
